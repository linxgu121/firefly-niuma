# Firefly 博客 - 正式配置（lingdi000721.cn）
# 构建产物由 GitHub Actions rsync 到 /var/www/firefly

# HTTP：ACME 验证例外，其余全部跳转 HTTPS
server {
    listen 80;
    server_name lingdi000721.cn www.lingdi000721.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lingdi000721.cn$request_uri;
    }
}

# HTTPS www：归一到主域
server {
    listen 443 ssl http2;
    server_name www.lingdi000721.cn;

    ssl_certificate     /etc/letsencrypt/live/lingdi000721.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingdi000721.cn/privkey.pem;

    return 301 https://lingdi000721.cn$request_uri;
}

# HTTPS 主站：博客本体
server {
    listen 443 ssl http2;
    server_name lingdi000721.cn;

    ssl_certificate     /etc/letsencrypt/live/lingdi000721.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingdi000721.cn/privkey.pem;

    root /var/www/firefly;
    index index.html;

    error_page 404 /404.html;

    # 安全响应头（对齐仓库 vercel.json）
    # 注意：nginx 的 add_header 不会继承到含自己 add_header 的 location，
    # 所以下面两个缓存 location 里重复声明了这三个头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/javascript;

    # Astro 带内容 hash 的构建产物，永久缓存
    location /_astro/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pagefind 搜索索引，缓存 1 小时
    location /pagefind/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        # HTML 等无 hash 资源：允许缓存但每次向服务器校验（ETag 命中则 304），
        # 保证每次部署后访客立即看到新内容
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
